name: CI/CD

on:
  push:
    branches: [ main, prod ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, prod ]
    types: [opened, synchronize, labeled]

jobs:
  cleanup-before:
    runs-on: ubuntu-latest
    steps:
      - name: Purge All Old Artifacts
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listArtifactsForRepo({
               owner: context.repo.owner,
               repo: context.repo.repo,
               per_page: 100
            });
            for (const artifact of data.artifacts) {
               await github.rest.actions.deleteArtifact({
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 artifact_id: artifact.id
               });
            }

  test:
    needs: cleanup-before
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Install System Dependencies (Xvfb & Playwright deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1
          npx playwright install
          npx playwright install-deps
      
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
      
      - name: Build for Testing
        run: npm run build
      
      - name: Run E2E Mock Tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run test:mock
      
      - name: Upload Test Artifacts
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-screenshots
          retention-days: 1
          path: test-mock-failure.png

  build-linux-win:
    needs: test
    if: |
      startsWith(github.ref, 'refs/tags/') || 
      github.ref == 'refs/heads/prod' ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'build-all') ||
        contains(github.event.pull_request.labels.*.name, 'build-linux') ||
        contains(github.event.pull_request.labels.*.name, 'build-windows')
      ))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Linux & Windows
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32 nsis
          npm run build:linux
          npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-ubuntu-latest
          retention-days: 1
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/*.yml
            
      - name: Direct Upload to Cloudflare R2 (Linux/Win)
        if: github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: true
        run: |
          aws s3 cp dist/ s3://${{ secrets.R2_BUCKET_NAME }}/ \
            --recursive --exclude "*" --include "*.exe" --include "*.AppImage" --include "*.deb" --include "*.blockmap" --include "*.yml" \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

  build-macos:
    needs: test
    if: |
      startsWith(github.ref, 'refs/tags/') || 
      github.ref == 'refs/heads/prod' ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'build-all') ||
        contains(github.event.pull_request.labels.*.name, 'build-macos')
      ))
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build MacOS
        run: npm run build:mac:universal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-latest
          retention-days: 1
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.yml

      - name: Direct Upload to Cloudflare R2 (MacOS)
        if: github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: true
        run: |
          aws s3 cp dist/ s3://${{ secrets.R2_BUCKET_NAME }}/ \
            --recursive --exclude "*" --include "*.dmg" --include "*.zip" --include "*.blockmap" --include "*.yml" \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

  release:
    needs: [build-linux-win, build-macos]
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/prod')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true
      
      - name: Clean up old "latest" release on GitHub
        if: github.ref == 'refs/heads/prod'
        run: |
          gh release delete latest-prod -y --cleanup-tag || true
          git push --delete origin latest-prod || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-prod' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Production Release (Latest)' }}
          files: release-artifacts/**/*
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Instant Quota Cleanup (Delete Workflow Artifacts)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId
              });
              for (const artifact of data.artifacts) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            } catch (e) {
              console.log("Cleanup failed or no artifacts found", e);
            }
