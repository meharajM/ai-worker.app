name: CI/CD

on:
  push:
    branches: [ main, prod ]
    # tags: [ 'v*' ]  # DISABLED: Tag pushes double-fire with prod push on release day
  pull_request:
    branches: [ main, prod ]
    types: [opened, synchronize]

# All platform builds are done locally and published to Cloudflare R2
# using the scripts in /scripts/publish-*.sh.
# Reason: GitHub Actions macOS runners cost 10x the free-tier minute rate.
# A single macOS build exhausts the monthly free quota. All CI here is
# Linux-only (1x rate) and limited to quality gates (lint, typecheck, tests).

jobs:
  # ── Quality Gate ─────────────────────────────────────────────────────────────
  # Runs on all PRs and pushes to main. Skipped on prod (already tested via main).
  test:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install System Dependencies (Xvfb & Playwright deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1
          # Only install chromium — firefox/webkit not tested, saves ~3 min per run
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Fix libsignal package name
        run: npm run prebuild:electron

      - name: Build for Testing
        run: npm run build

      - name: Run E2E Mock Tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run test:mock

  # DISABLED: build-linux-win job
