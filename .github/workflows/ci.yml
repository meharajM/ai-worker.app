name: CI/CD

on:
  push:
    branches: [ main, prod ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, prod ]
    types: [opened, synchronize, labeled]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Install System Dependencies (Xvfb & Playwright deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1
          npx playwright install
          npx playwright install-deps
      
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
      
      - name: Build for Testing
        run: npm run build
      
      - name: Run E2E Mock Tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run test:mock
      
      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-screenshots
          path: test-mock-failure.png

  build-linux-win:
    needs: test
    if: |
      startsWith(github.ref, 'refs/tags/') || 
      github.ref == 'refs/heads/prod' ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'build-all') ||
        contains(github.event.pull_request.labels.*.name, 'build-linux') ||
        contains(github.event.pull_request.labels.*.name, 'build-windows')
      ))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Linux & Windows
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32 nsis
          npm run build:linux
          npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-ubuntu-latest
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/*.yml

  build-macos:
    needs: test
    if: |
      startsWith(github.ref, 'refs/tags/') || 
      github.ref == 'refs/heads/prod' ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'build-all') ||
        contains(github.event.pull_request.labels.*.name, 'build-macos')
      ))
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build MacOS
        run: npm run build:mac:universal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-latest
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.yml

  release:
    needs: [build-linux-win, build-macos]
    # Allow release if both builds succeed and it is a tag OR a push to prod
    if: success() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/prod')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true
      
      - name: List Artifacts (Debug)
        run: ls -R release-artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-prod' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Production Release (Latest)' }}
          files: release-artifacts/**/*
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: true
        run: |
          aws s3 sync release-artifacts/ s3://${{ secrets.R2_BUCKET_NAME }}/ \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --delete
