name: Feature request
description: Suggest a workflow, integration, or product improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
      placeholder: Describe the workflow or limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like AI-Worker to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat
        - LLM providers
        - MCP connections
        - Browser automation
        - Speech recognition
        - WhatsApp
        - Packaging or install
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What do you do today instead?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, examples, or related tools.
