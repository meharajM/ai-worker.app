<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>AI-Worker</title>
  <!--
    Content Security Policy for Electron
    - default-src 'self': Allow resources from same origin
    - script-src: Allow inline and eval for React/Vite, plus Google APIs for Firebase Auth
    - style-src: Allow inline styles for Tailwind
    - connect-src: Allow all network connections for:
      * localhost: Ollama, dev server
      * wss/https google: Web Speech API
      * https: OpenAI, Firebase, and other APIs
    - frame-src: Allow Google OAuth popup
    - media-src: Allow audio for TTS
    - img-src: Allow images from any source
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self';
             script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://*.gstatic.com https://*.googleapis.com;
             style-src 'self' 'unsafe-inline';
             connect-src 'self' ws://localhost:* http://localhost:* https://* wss://*;
             frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://*.google.com;
             media-src 'self' blob: data:;
             img-src 'self' data: blob: https: https://*.googleusercontent.com;" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>

</html>
